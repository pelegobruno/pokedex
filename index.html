<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Seu Título</title>
    <style>
        .contact a {
            margin: 0 10px;
            color: #000; /* Cor padrão */
            text-decoration: none; /* Remove o sublinhado */

        }
        .contact a:hover {
            color: #007bff; /* Cor ao passar o mouse */
        }
    </style>
</head>

<div class="controls">
    <div class="nav-buttons">
        <button id="prevBtn">Anterior</button>
        <button id="nextBtn">Próximo</button>
    </div>
</div>

<footer>
    <div class="contact">
        <a href="https://github.com/pelegobruno" target="_blank">
            <i class="fab fa-github"></i>
        </a>
        <a href="https://instagram.com/brunocfeijo" target="_blank">
            <i class="fab fa-instagram"></i>
        </a>
    </div>
